upstream backend {
    server api1:3000;
    server api2:3000;
    server api3:3000;
}

server {
    listen 80;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://backend;
    }
}
