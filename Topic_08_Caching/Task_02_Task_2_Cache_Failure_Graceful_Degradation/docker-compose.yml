services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
      - api3
  api1:
    build: ./backend
    environment:
      PORT: 3000
      INSTANCE_NAME: api1
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
  api2:
    build: ./backend
    environment:
      PORT: 3000
      INSTANCE_NAME: api2
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
  api3:
    build: ./backend
    environment:
      PORT: 3000
      INSTANCE_NAME: api3
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
