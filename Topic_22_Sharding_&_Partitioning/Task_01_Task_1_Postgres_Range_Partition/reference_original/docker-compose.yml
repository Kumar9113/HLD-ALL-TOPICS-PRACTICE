services:
  postgres:
    build: .
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hld_lab
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d hld_lab
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
    - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
