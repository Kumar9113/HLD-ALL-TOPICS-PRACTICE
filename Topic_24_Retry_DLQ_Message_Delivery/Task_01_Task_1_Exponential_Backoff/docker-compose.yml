services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
      - api3
  api1:
    build: ./backend
    environment:
      PORT: 3000
      INSTANCE_NAME: api1
      AMQP_URL: amqp://app:app@rabbitmq:5672
    depends_on:
      - rabbitmq
  api2:
    build: ./backend
    environment:
      PORT: 3000
      INSTANCE_NAME: api2
      AMQP_URL: amqp://app:app@rabbitmq:5672
    depends_on:
      - rabbitmq
  api3:
    build: ./backend
    environment:
      PORT: 3000
      INSTANCE_NAME: api3
      AMQP_URL: amqp://app:app@rabbitmq:5672
    depends_on:
      - rabbitmq
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: worker.Dockerfile
    environment:
      AMQP_URL: amqp://app:app@rabbitmq:5672
    depends_on:
      - rabbitmq
