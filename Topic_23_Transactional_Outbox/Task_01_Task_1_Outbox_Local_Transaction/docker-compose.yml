services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
      - api3
  api1:
    build: ./backend
    environment:
      PORT: 3000
      INSTANCE_NAME: api1
      DATABASE_URL: postgres://app:app@postgres:5432/hld
      AMQP_URL: amqp://app:app@rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
  api2:
    build: ./backend
    environment:
      PORT: 3000
      INSTANCE_NAME: api2
      DATABASE_URL: postgres://app:app@postgres:5432/hld
      AMQP_URL: amqp://app:app@rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
  api3:
    build: ./backend
    environment:
      PORT: 3000
      INSTANCE_NAME: api3
      DATABASE_URL: postgres://app:app@postgres:5432/hld
      AMQP_URL: amqp://app:app@rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: hld
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app -d hld
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

  worker:
    build:
      context: .
      dockerfile: worker.Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/hld
      AMQP_URL: amqp://app:app@rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
