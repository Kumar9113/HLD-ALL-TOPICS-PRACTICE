services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
      - api3
  api1:
    build: ./backend
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/hld
      INSTANCE_NAME: api1
    depends_on:
      - postgres
  api2:
    build: ./backend
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/hld
      INSTANCE_NAME: api2
    depends_on:
      - postgres
  api3:
    build: ./backend
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/hld
      INSTANCE_NAME: api3
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: hld
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup:/backup
volumes:
  pgdata:
